.tint{position:absolute;inset:0;background:#ff1208;mix-blend-mode:color;opacity:0;transition:opacity 1s}
body.red .tint{opacity:.95}
.scan{position:absolute;left:0;right:0;height:18%;background:linear-gradient(transparent,rgba(var(--glow),.09),transparent);animation:scan 5s linear infinite;pointer-events:none}
@keyframes scan{from{top:-18%}to{top:100%}}
.core{position:absolute;left:49.1%;top:63.5%;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;background:radial-gradient(circle,rgba(var(--glow),.55),rgba(var(--glow),0) 65%);cursor:pointer;padding:0;animation:pulse 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.18);filter:brightness(1.4)}}
.core:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.core svg{position:absolute;inset:-18%;width:136%;height:136%;fill:none;stroke:var(--acc);stroke-width:1.2;pointer-events:none}
.r1{transform-origin:50% 50%;animation:spin 14s linear infinite}
.r2{transform-origin:50% 50%;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
body.red .core{animation-duration:.8s}
body.red .r1{animation-duration:3s}body.red .r2{animation-duration:2s}
body.red .stage{animation:drift 9s ease-in-out infinite,shake .12s 6}
@keyframes shake{25%{margin-left:-6px}75%{margin-left:6px}}
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;z-index:5;pointer-events:none}
h1{margin:0;font-size:clamp(20px,5vw,34px);font-weight:700;letter-spacing:.35em;text-indent:.35em;color:var(--acc);transition:color .6s;text-shadow:0 0 18px rgba(var(--glow),.45)}
.sub{margin:6px 0 0;font-size:12px;letter-spacing:.12em;opacity:.7}
.hud{position:fixed;left:0;right:0;bottom:0;padding:48px 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:linear-gradient(transparent,rgba(0,0,0,.88) 40%);z-index:5;text-align:center;pointer-events:none}
#msg{margin:0 auto;max-width:34em;font-size:clamp(15px,4.2vw,24px);font-weight:700;line-height:1.35;color:var(--acc);text-shadow:0 0 16px rgba(var(--glow),.6);transition:color .6s}
#hint{margin:8px 0 0;font-size:12px;letter-spacing:.1em;opacity:.65;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
body.red #msg{animation:alert .7s steps(2) infinite}
@keyframes alert{50%{text-shadow:0 0 4px rgba(var(--glow),.3)}}
.dust{position:fixed;inset:0;pointer-events:none;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}

.eye{position:absolute;width:5.5%;height:1.6%;transform:translate(-50%,-50%) rotate(var(--r,0deg));border-radius:50%;background:radial-gradient(ellipse,rgba(var(--glow),.95),rgba(var(--glow),0) 70%);filter:blur(2px);animation:eye 3.2s ease-in-out infinite;mix-blend-mode:screen}
.eye.b{--r:-8deg}.eye.a{--r:8deg}
@keyframes eye{0%,100%{opacity:.35}45%{opacity:1;filter:blur(4px)}50%{opacity:.2}55%{opacity:1}}
.halo{position:absolute;left:49%;top:52%;width:78%;transform:translate(-50%,-50%);fill:none;stroke:rgba(var(--glow),.35);stroke-width:.35;pointer-events:none}
.h1{transform-origin:100px 100px;animation:spin 40s linear infinite}.h2{transform-origin:100px 100px;animation:spin 26s linear infinite reverse}.h3{transform-origin:100px 100px;animation:spin 60s linear infinite}
.sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(var(--glow),.12) 50%,transparent 60%);background-size:250% 100%;animation:sweep 7s ease-in-out infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes sweep{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
.tele{position:fixed;top:50%;font-size:10px;line-height:1.9;letter-spacing:.08em;opacity:.55;z-index:4;pointer-events:none;color:var(--acc);transform:translateY(-50%)}
.tele.l{left:10px}.tele.r{right:10px;text-align:right}
@media(max-width:640px){.tele{top:20%;font-size:8px}}
.chat{pointer-events:auto;max-width:34em;margin:10px auto 0;display:flex;gap:8px}
.chat input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.6);border:1px solid var(--acc);border-radius:22px;padding:11px 16px;outline:none;backdrop-filter:blur(6px);transition:border-color .6s,box-shadow .3s}
.chat input:focus{box-shadow:0 0 14px rgba(var(--glow),.5)}
.chat button{font:inherit;font-size:13px;font-weight:700;color:#000;background:var(--acc);border:0;border-radius:22px;padding:0 18px;cursor:pointer;transition:background .6s}
.chat button.mic{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:0 12px}
.chat button.mic.on{background:var(--acc);color:#000}
#msg{max-height:24vh;min-height:0;overflow-y:auto;pointer-events:auto;padding:0 4px;text-shadow:0 0 12px rgba(0,0,0,.9),0 0 16px rgba(var(--glow),.5)}
.dots::after{content:"…";animation:blink 1s infinite}

.snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:6;background:rgba(0,0,0,.5);border:1px solid var(--acc);color:var(--acc);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer}

.stage{translate:var(--px,0) var(--py,0);transition:translate .25s ease-out}
body:not(.on) .stage{opacity:0}
body.on .stage{animation:drift 9s ease-in-out infinite,poweron 2.4s both}
body.on.red .stage{animation:drift 9s ease-in-out infinite,shake .12s 6}
@keyframes poweron{0%{opacity:0;filter:brightness(4) blur(8px)}14%{opacity:.9}20%{opacity:.05}32%{opacity:1;filter:brightness(2) blur(1px)}40%{opacity:.4}100%{opacity:1;filter:none}}
header,.hud,.tele{transition:opacity 1.6s 1.4s}
body:not(.on) header,body:not(.on) .hud,body:not(.on) .tele,body:not(.on) .snd{opacity:0;pointer-events:none}
#intro{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-content:center;justify-items:center;gap:26px;cursor:pointer;transition:opacity .9s,transform .9s}
#intro.go{opacity:0;transform:scale(1.5);pointer-events:none}
#intro p{margin:0;font-size:13px;letter-spacing:.4em;text-indent:.4em;color:#cfd8e0;animation:blink 1.6s infinite}
.ir{width:84px;height:84px;border-radius:50%;border:2px solid #cfd8e0;border-top-color:transparent;border-bottom-color:transparent;box-shadow:0 0 24px rgba(255,255,255,.4);animation:spin 1.4s linear infinite}
.radar{position:absolute;left:49%;top:52%;width:72%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,rgba(var(--glow),.2),transparent 24%);-webkit-mask:radial-gradient(circle,transparent 32%,#000 33%,#000 69%,transparent 70%);mask:radial-gradient(circle,transparent 32%,#000 33%,#000 69%,transparent 70%);animation:rot 6s linear infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.shock{position:absolute;left:49.1%;top:63.5%;width:10%;aspect-ratio:1;border:3px solid rgba(var(--glow),.9);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.3);pointer-events:none}
.shock.go{animation:shock 1.1s ease-out}
@keyframes shock{from{opacity:1;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(9)}}
.wave{display:flex;justify-content:center;align-items:center;gap:3px;height:26px;margin:0 0 4px;opacity:0;transition:opacity .4s}
body.talk .wave{opacity:1}
.wave i{width:3px;height:4px;border-radius:2px;background:var(--acc);box-shadow:0 0 6px rgba(var(--glow),.8);animation:wv .5s ease-in-out infinite alternate;animation-play-state:paused}
body.talk .wave i{animation-play-state:running}
@keyframes wv{to{height:24px}}
body.talk .eye{animation-duration:.6s}body.talk .core{animation-duration:.9s}body.talk .r1{animation-duration:4s}
h1{animation:glitch 7s infinite}
@keyframes glitch{0%,93%,100%{transform:none;opacity:1}94%{transform:translateX(-5px) skewX(10deg);opacity:.6}96%{transform:translateX(5px);opacity:.8}98%{transform:none}}
</style></head>
<body>
<div class="stage">
  <div class="bg"></div><div class="radar"></div><svg class="halo" viewBox="0 0 200 200"><circle class="h1" cx="100" cy="100" r="96" stroke-dasharray="1 3 12 3"/><circle class="h2" cx="100" cy="100" r="86" stroke-dasharray="30 8"/><circle class="h3" cx="100" cy="100" r="74" stroke-dasharray="2 5"/></svg><div class="eye a" style="left:45.2%;top:37.8%"></div><div class="eye b" style="left:54.2%;top:37.8%"></div><div class="sweep"></div><div class="tint"></div><div class="scan"></div>
  <button class="core" id="core" aria-label="Activar o desactivar el modo defensa">
    <svg viewBox="0 0 100 100"><circle class="r1" cx="50" cy="50" r="46" stroke-dasharray="6 5 20 5"/><circle class="r2" cx="50" cy="50" r="40" stroke-dasharray="2 6"/></svg>
  </button>
<div class="shock"></div>
</div>
<canvas class="dust" id="dust"></canvas><canvas class="dust" id="spark"></canvas><div id="intro"><div class="ir"></div><p>Toca para iniciar</p></div>
<button class="snd" id="snd" aria-label="Sonido">🔊</button><header><h1>J.A.R.V.I.S.</h1><p class="sub" id="sub">SISTEMAS EN LÍNEA</p></header>
<div class="tele l"><div>PWR <b id="t1">100</b>%</div><div>REACTOR <b id="t2">3.2</b> GJ</div><div>ALT <b id="t3">0</b> M</div></div>
<div class="tele r"><div>ESCUDOS <b id="t4">100</b>%</div><div>LATENCIA <b id="t5">12</b> MS</div><div id="t6">ENLACE ESTABLE</div></div>
<div class="hud"><div class="wave" id="wave" aria-hidden="true"></div><p id="msg" aria-live="polite"></p><div class="chat"><button class="mic" id="mic" aria-label="Hablar" hidden>🎙</button><input id="q" placeholder="Pregúntale algo a Jarvis" autocomplete="off" enterkeyhint="send"><button id="go">Enviar</button></div><p id="hint">Toca el núcleo para activar el modo defensa</p></div>
<script>
const body=document.body,msg=document.getElementById('msg'),sub=document.getElementById('sub'),hint=document.getElementById('hint');
let timer;
function type(t){clearInterval(timer);msg.textContent='';let i=0;timer=setInterval(()=>{msg.textContent=t.slice(0,++i);if(i%2)S.tick();if(i>=t.length)clearInterval(timer)},45)}

document.getElementById('core').addEventListener('click',()=>{
  const on=body.classList.toggle('red');hint.style.display='none';
  const t=on?'Modo defensa activado, señorita Kerens':'Modo defensa desactivado. Sistemas en espera.';
  on?S.alarm():S.off();burst();const sk=document.querySelector('.shock');sk.classList.remove('go');void sk.offsetWidth;sk.classList.add('go');sub.textContent=on?'MODO DEFENSA':'SISTEMAS EN LÍNEA';type(t);say(t);
  if(navigator.vibrate)try{navigator.vibrate(on?[80,40,80]:30)}catch(e){}
});

const q=document.getElementById('q'),go=document.getElementById('go'),mic=document.getElementById('mic');
const hist=[];let busy=false,sampleP=null;
function getSample(){return sampleP||(sampleP=(window.claude&&claude.use?claude.use('sample'):Promise.resolve(null)).catch(()=>null))}
async function ask(){
  const text=q.value.trim();if(!text||busy)return;
  busy=true;go.disabled=true;q.value='';hint.style.display='none';clearInterval(timer);S.send();
  msg.innerHTML='<span class="dots">Procesando</span>';
  const red=body.classList.contains('red');
  const sys='Eres J.A.R.V.I.S., la inteligencia artificial elegante, ingeniosa y muy amable de una armadura tipo Iron Man. Te diriges siempre a la usuaria como "señorita Kerens". Responde en español, con calidez y un toque de humor fino, en 1 a 3 frases cortas (sin listas ni markdown). Estado actual: '+(red?'MODO DEFENSA ACTIVO, tono más táctico y alerta pero siempre amable.':'sistemas normales, tono relajado.');
  const prior=hist.slice(-6).map(m=>(m.r==='u'?'Señorita Kerens: ':'Jarvis: ')+m.t).join('\n');
  try{
    const a=((await generate(sys+'\n\nConversación previa:\n'+(prior||'(ninguna)')+'\n\nSeñorita Kerens: '+text+'\n\nResponde ahora como Jarvis:'))||'').trim()||'No obtuve respuesta, señorita Kerens.';
    hist.push({r:'u',t:text},{r:'j',t:a});S.reply();type(a);say(a);
  }catch(e){msg.textContent=errText(e)}
  busy=false;go.disabled=false;
}
go.addEventListener('click',ask);q.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){mic.hidden=false;mic.addEventListener('click',()=>{try{const s=new SR();s.lang='es-MX';mic.classList.add('on');s.onresult=e=>{q.value=e.results[0][0].transcript;ask()};s.onend=()=>mic.classList.remove('on');s.start()}catch(e){mic.classList.remove('on')}})}
const $=id=>document.getElementById(id);
setInterval(()=>{const r=body.classList.contains('red');
$('t1').textContent=r?(100+Math.random()*20|0):(97+Math.random()*3|0);
$('t2').textContent=(r?4.8+Math.random()*.9:3.1+Math.random()*.2).toFixed(1);
$('t3').textContent=r?(40+Math.random()*30|0):0;
$('t4').textContent=r?100:(94+Math.random()*6|0);
$('t5').textContent=8+Math.random()*10|0;
$('t6').textContent=r?'AMENAZAS: ESCANEANDO':'ENLACE ESTABLE'},900);

let AC,M,REV,hum,muted=false,voice=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=.9;const cp=AC.createDynamicsCompressor();M.connect(cp);cp.connect(AC.destination);REV=AC.createConvolver();const n=AC.sampleRate*1.8,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}REV.buffer=b;const rg=AC.createGain();rg.gain.value=.35;REV.connect(rg);rg.connect(cp)}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,v,w,f2,wet){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(w||0);o.type=ty||'sine';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.06,s+.008);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(M);if(wet!==0)g.connect(REV);o.start(s);o.stop(s+d+.05)}
function whoosh(d,f1,f2,v,w){const a=ac();if(!a||muted)return;const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=n.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=n;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=3;const t=a.currentTime+(w||0);f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.4);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(g);g.connect(M);g.connect(REV);s.start(t)}
const PENT=[880,988,1175,1319,1568,1760,2093];
const S={
boot(){whoosh(1.6,200,5000,.35);[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'sine',.07,.5+i*.09));tone(65,1.8,'sawtooth',.06,0,130,0)},
send(){tone(660,.1,'triangle',.07,0,990);tone(990,.14,'sine',.06,.08,1480)},
reply(){whoosh(.5,800,3500,.18);[784,1047,1568].forEach((f,i)=>tone(f,.4,'sine',.06,i*.07))},
tick(){tone(PENT[Math.random()*PENT.length|0],.06,'sine',.02,0,0,0)},
alarm(){whoosh(.9,150,2500,.4);for(let i=0;i<5;i++){tone(440,.3,'sawtooth',.06,i*.5,880);tone(880,.3,'sawtooth',.05,i*.5+.25,440)}tone(55,2.5,'square',.08,0,40,0)},
off(){whoosh(.9,3000,120,.3);tone(900,.7,'triangle',.07,0,150)}};
function startHum(){const a=ac();if(!a||hum)return;const g=a.createGain();g.gain.value=muted?0:.03;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const l=a.createOscillator(),lg=a.createGain();l.frequency.value=.12;lg.gain.value=220;l.connect(lg);lg.connect(f.frequency);l.start();[55,55.4,82.5,110.3].forEach(x=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=x;o.connect(f);o.start()});f.connect(g);g.connect(a.destination);hum=g}
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^es/i.test(x.lang));for(const p of [/natural/i,/jorge|diego|juan|carlos|pablo|enrique|google/i]){const m=v.find(x=>p.test(x.name));if(m)return m}return v[0]||null}
try{speechSynthesis.onvoiceschanged=()=>{voice=pickVoice()};voice=pickVoice()}catch(e){}
function say(t){if(muted)return;try{speechSynthesis.cancel();const ps=t.match(/[^.!?¡¿]+[.!?]*/g)||[t];ps.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang=voice?voice.lang:'es-ES';if(voice)u.voice=voice;u.rate=.92;u.pitch=.6;if(i===0)u.onstart=()=>body.classList.add('talk');if(i===ps.length-1)u.onend=u.onerror=()=>body.classList.remove('talk');speechSynthesis.speak(u)});setTimeout(()=>body.classList.remove('talk'),Math.max(5000,t.length*130))}catch(e){}}
$('snd').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';if(hum)hum.gain.value=muted?0:.03;if(muted){try{speechSynthesis.cancel()}catch(x){}body.classList.remove('talk')}});
const wv=$('wave');for(let i=0;i<30;i++){const s=document.createElement('i');s.style.animationDelay=-Math.random()*.5+'s';s.style.animationDuration=.3+Math.random()*.4+'s';wv.appendChild(s)}
const sc=$('spark'),sx=sc.getContext('2d');let B=[];
function sz(){sc.width=innerWidth;sc.height=innerHeight}sz();addEventListener('resize',sz);
function burst(){const r=$('core').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,red=body.classList.contains('red');for(let i=0;i<70;i++){const a=Math.random()*6.283,s=2+Math.random()*7;B.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:red?'255,90,60':'220,235,255'})}}
(function f(){sx.clearRect(0,0,sc.width,sc.height);B=B.filter(p=>p.l>0);B.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.l-=.02;sx.fillStyle='rgba('+p.c+','+p.l+')';sx.fillRect(p.x,p.y,2.2,2.2)});requestAnimationFrame(f)})();
const G='Buenas noches, señorita Kerens. Todos los sistemas operativos. ¿En qué puedo ayudarla?';
$('intro').addEventListener('click',()=>{ac();startHum();S.boot();$('intro').classList.add('go');body.classList.add('on');setTimeout(()=>{burst();type(G);say(G)},1900)},{once:true});
const stl=document.querySelector('.stage').style;
addEventListener('pointermove',e=>{stl.setProperty('--px',((e.clientX/innerWidth-.5)*-26)+'px');stl.setProperty('--py',((e.clientY/innerHeight-.5)*-18)+'px')});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;stl.setProperty('--px',Math.max(-30,Math.min(30,-e.gamma))+'px');stl.setProperty('--py',Math.max(-20,Math.min(20,-(e.beta-45)*.5))+'px')});
async function generate(p){const s=await getSample();if(!s)throw{code:'na'};return (await s(p,{cache:false,modelTier:'quick'})).text}
function errText(e){return e&&e.code==='na'?'Mi enlace con la IA no está disponible aquí, señorita Kerens. Abra la página desde claude.ai.':e&&e.code==='rate_limited'?'Demasiadas consultas seguidas, señorita Kerens. Deme un momento.':'No pude procesar eso, señorita Kerens. Inténtelo de nuevo.'}
const c=document.getElementById('dust'),x=c.getContext('2d');let W,H,P=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,v:.2+Math.random()*.5,r:Math.random()*1.4+.3}))}
rs();addEventListener('resize',rs);
(function f(){x.clearRect(0,0,W,H);x.fillStyle=body.classList.contains('red')?'rgba(255,70,50,.55)':'rgba(220,230,240,.45)';
P.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})();
</script></body></html>
